name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: incident
          POSTGRES_DB: incident
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incident" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://incident:incident@localhost:5432/incident
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-backend.txt
      - run: alembic upgrade head
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t incident-iq .
